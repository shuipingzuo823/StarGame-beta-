<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>太阳系星图 · 九大行星</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
            color: #dbe5ff;
            -webkit-font-smoothing: antialiased;
        }

        #c {
            display: block;
            width: 100vw;
            height: 100vh;
            background: #000;
            cursor: grab;
        }

        #c.dragging {
            cursor: grabbing;
        }

        .panel {
            position: fixed;
            background: rgba(5, 7, 12, .72);
            border: 1px solid rgba(120, 155, 220, .20);
            border-radius: 10px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 8px 28px rgba(0, 0, 0, .7);
            font-size: 12px;
            line-height: 1.55;
            z-index: 10;
        }

        #head {
            left: 16px;
            top: 16px;
            padding: 10px 14px;
            min-width: 210px;
        }

        #head .t1 {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: .5px;
            color: #eaf0ff;
        }

        #head .t2 {
            font-size: 11.5px;
            color: #8ea3cc;
            margin-top: 3px;
            font-variant-numeric: tabular-nums;
        }

        #side {
            right: 16px;
            top: 16px;
            width: 282px;
            padding: 11px 13px 13px;
            max-height: calc(100vh - 32px);
            overflow: auto;
        }

        #side::-webkit-scrollbar {
            width: 6px;
        }

        #side::-webkit-scrollbar-thumb {
            background: rgba(120, 155, 220, .25);
            border-radius: 3px;
        }

        .sec-title {
            font-size: 11px;
            color: #7f95bf;
            letter-spacing: 1px;
            margin: 2px 0 7px;
        }

        .sec-title+.sec-title {
            margin-top: 14px;
            padding-top: 11px;
            border-top: 1px solid rgba(120, 155, 220, .14);
        }

        #plist {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }

        .pbtn {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 3px 8px;
            border-radius: 14px;
            cursor: pointer;
            background: rgba(120, 155, 220, .09);
            border: 1px solid rgba(120, 155, 220, .16);
            color: #c6d3ee;
            font-size: 11.5px;
            user-select: none;
            transition: .15s;
        }

        .pbtn:hover {
            background: rgba(120, 155, 220, .22);
            color: #fff;
        }

        .pbtn.on {
            background: rgba(90, 140, 255, .30);
            border-color: rgba(140, 180, 255, .6);
            color: #fff;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex: 0 0 auto;
        }

        #info {
            font-size: 11.5px;
            color: #a8b8d8;
        }

        #info .nm {
            font-size: 13.5px;
            color: #eaf0ff;
            font-weight: 600;
            margin-bottom: 6px;
        }

        #info .nm small {
            font-weight: 400;
            color: #7f95bf;
            font-size: 11px;
            margin-left: 4px;
        }

        #info .grp {
            margin: 9px 0 3px;
            padding-top: 7px;
            border-top: 1px solid rgba(120, 155, 220, .16);
            color: #8fb4ff;
            font-size: 11px;
            letter-spacing: .5px;
        }

        #levels {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }

        #info .kv {
            display: flex;
            justify-content: space-between;
            gap: 8px;
        }

        #info .kv span:first-child {
            color: #7f95bf;
        }

        #info .kv span:last-child {
            color: #d6e1f7;
            font-variant-numeric: tabular-nums;
        }

        #info .desc {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid rgba(120, 155, 220, .14);
            color: #93a6c8;
            line-height: 1.65;
        }

        #ctrl {
            left: 16px;
            bottom: 16px;
            padding: 12px 14px;
            width: 290px;
        }

        #ctrl .row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        #ctrl .row:last-child {
            margin-bottom: 0;
        }

        #ctrl label {
            color: #8ea3cc;
            flex: 0 0 auto;
            font-size: 11.5px;
        }

        #ctrl .val {
            color: #c9d7f2;
            font-size: 11px;
            flex: 0 0 auto;
            min-width: 56px;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        input[type=range] {
            -webkit-appearance: none;
            appearance: none;
            flex: 1 1 auto;
            height: 3px;
            border-radius: 2px;
            background: rgba(120, 155, 220, .28);
            outline: none;
            cursor: pointer;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #8fb4ff;
            border: 2px solid #0a0f1a;
            box-shadow: 0 0 6px rgba(110, 160, 255, .8);
            cursor: pointer;
        }

        .btn {
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid rgba(120, 155, 220, .28);
            cursor: pointer;
            background: rgba(120, 155, 220, .12);
            color: #cddcf8;
            font-size: 11.5px;
            font-family: inherit;
            transition: .15s;
        }

        .btn:hover {
            background: rgba(120, 155, 220, .26);
            color: #fff;
        }

        select,
        input[type=date] {
            flex: 1 1 auto;
            background: rgba(120, 155, 220, .10);
            color: #cddcf8;
            border: 1px solid rgba(120, 155, 220, .24);
            border-radius: 6px;
            padding: 3px 6px;
            font-size: 11.5px;
            font-family: inherit;
            outline: none;
        }

        select option {
            background: #0b0f18;
        }

        .checks {
            flex-wrap: wrap;
            gap: 10px 14px !important;
        }

        .checks label {
            display: flex;
            align-items: center;
            gap: 4px;
            color: #a8b8d8;
            cursor: pointer;
        }

        input[type=checkbox] {
            accent-color: #5a8cff;
            cursor: pointer;
        }

        #hint {
            right: 16px;
            bottom: 16px;
            padding: 7px 12px;
            color: #6d80a6;
            font-size: 11px;
        }
    </style>
</head>

<body>
    <canvas id="c"></canvas>

    <div class="panel" id="head">
        <div class="t1">太阳系星图 · Solar System</div>
        <div class="t2" id="clock">—</div>
        <div class="t2" id="rate"></div>
    </div>

    <div class="panel" id="side">
        <div class="sec-title">星图层级</div>
        <div id="levels"></div>
        <div class="sec-title">天体列表</div>
        <div id="plist"></div>
        <div class="sec-title" id="infoTitle">天体档案</div>
        <div id="info"></div>
    </div>

    <div class="panel" id="ctrl">
        <div class="row">
            <button class="btn" id="btnPlay">暂停</button>
            <button class="btn" id="btnNow">回到现在</button>
            <button class="btn" id="btnReset">重置视角</button>
        </div>
        <div class="row"><label>时间流速</label><input type="range" id="speed" min="0" max="1000" value="486"><span
                class="val" id="speedVal"></span></div>
        <div class="row"><label>日期</label><input type="date" id="date"></div>
        <div class="row"><label>视角倾角</label><input type="range" id="tilt" min="0" max="85" value="22"><span class="val"
                id="tiltVal"></span></div>
        <div class="row"><label>星体大小</label><input type="range" id="size" min="0.6" max="4" step="0.1" value="1.6"><span
                class="val" id="sizeVal"></span></div>
        <div class="row"><label>距离比例</label>
            <select id="mode">
                <option value="compressed">压缩视图（全系可见）</option>
                <option value="linear">真实比例（1 AU 实际比例）</option>
            </select>
        </div>
        <div class="row checks">
            <label><input type="checkbox" id="cOrbits" checked>轨道</label>
            <label><input type="checkbox" id="cLabels" checked>名称</label>
            <label><input type="checkbox" id="cSpin" checked>自转</label>
            <label><input type="checkbox" id="cStars" checked>星空</label>
            <label><input type="checkbox" id="cBelt" checked>小行星带</label>
        </div>
    </div>

    <div class="panel" id="hint">拖拽平移 · 滚轮缩放 · 单击天体查看档案 · 双击跟随</div>

                                ["类型", "SBbc 棒旋星系"],
                                ["直径", "约 10 万光年（恒星盘）"],
                                ["恒星数量", "1,000–4,000 亿颗"],
                                ["总质量", "约 1.5×10¹² 太阳质量"],
                                ["年龄", "约 136 亿年"]
                            ]
                        },
                        {
                            g: "结构与太阳", kv: [
                                ["结构", "银核 + 棒状结构 + 4 条主旋臂 + 银晕"],
                                ["中心黑洞", "人马座 A*，约 4.3×10⁶ 太阳质量"],
                                ["太阳位置", "猎户臂，距银心约 2.6 万光年"],
                                ["公转速度 / 周期", "约 230 km/s / 约 2.3 亿年"]
                            ]
                        },
                        {
                            g: "光谱与观测", kv: [
                                ["整体光谱", "旋臂以蓝白色年轻恒星与 H II 区为主，银核偏黄红"],
                                ["尘埃辐射", "远红外 100–200 μm 由星际尘埃主导"],
                                ["特征谱线", "21 cm 中性氢线、CO 分子线（旋臂示踪）"]
                            ]
                        }
                    ],
                    desc: "太阳系所在的棒旋星系。若要加入河系级星图，可新增 state.level === \"galaxy\" 视图与对应渲染分支。"
                }
            ]
        };

        /* 当前场景（渲染始终读取 scene / bodies，切换星系只需重指 scene 并重建交互） */
        let scene = DB.systems.find(s => s.id === DB.activeSystemId) || DB.systems[0];
        let bodies = scene.bodies;

        /* 天体字段归一化：未显式给出的 id / type 自动补全，便于批量加数据 */
        function normalizeBodies(sys) {
            sys.bodies.forEach((b, i) => {
                if (!b.id) b.id = "body-" + i;
                if (!b.type) b.type = b.dwarf ? "dwarf" : "planet";
                if (b.color && !b.dark) b.dark = shade(b.color, 0.30);   /* 背光/阴面颜色缺省推导 */
            });
            if (sys.star) { sys.star.id = sys.star.id || "star"; sys.star.type = "star"; }
            return sys;
        }
        DB.systems.forEach(normalizeBodies);
        bodies = scene.bodies;

        /* ---------- 2. 轨道力学 ---------- */
        function norm2pi(a) { a %= TAU; return a < 0 ? a + TAU : a; }
        function normPi(a) { a = norm2pi(a); return a > Math.PI ? a - TAU : a; }

        function elemAt(p, T) {
            const e = p.el;
            return {
                a: e.a[0] + e.a[1] * T,
                e: e.e[0] + e.e[1] * T,
                I: (e.I[0] + e.I[1] * T) * D2R,
                L: (e.L[0] + e.L[1] * T) * D2R,
                wbar: (e.w[0] + e.w[1] * T) * D2R,
                node: (e.n[0] + e.n[1] * T) * D2R
            };
        }

        /* 由轨道根数 + 平近点角求日心黄道直角坐标（AU） */
        function posFromElems(el, M) {
            const a = el.a, e = el.e, I = el.I, node = el.node, w = el.wbar - el.node;
            let E = M + e * Math.sin(M);
            for (let i = 0; i < 8; i++) {
                const d = (E - e * Math.sin(E) - M) / (1 - e * Math.cos(E));
                E -= d;
                if (Math.abs(d) < 1e-12) break;
            }
            const xp = a * (Math.cos(E) - e);
            const yp = a * Math.sqrt(1 - e * e) * Math.sin(E);
            const cw = Math.cos(w), sw = Math.sin(w), cn = Math.cos(node), sn = Math.sin(node);
            const ci = Math.cos(I), si = Math.sin(I);
            return {
                x: (cw * cn - sw * sn * ci) * xp + (-sw * cn - cw * sn * ci) * yp,
                y: (cw * sn + sw * cn * ci) * xp + (-sw * sn + cw * cn * ci) * yp,
                z: (sw * si) * xp + (cw * si) * yp
            };
        }

        function planetPos(p, simDays) {
            const el = elemAt(p, simDays / 36525);
            return posFromElems(el, normPi(el.L - el.wbar));
        }

        /* ---------- 3. 状态 ---------- */
        /* 选中目标的统一表示：null | { kind:"star" } | { kind:"body", i }
           新增可选中对象类型（卫星、小行星、空间站…）时只需扩展 selObj / hitTest */
        const state = {
            simDays: 0, playing: true, speed: 20,
            mode: "compressed", tiltDeg: 22, planetSize: 1.6,
            zoom: 1, panX: 0, panY: 0,
            follow: null,          /* 跟随目标（同上结构） */
            sel: null,             /* 点选的目标 */
            hover: null,           /* 悬停目标 */
            showOrbits: true, showLabels: true, showSpin: true, showStars: true, showBelt: true
        };

        function starSel() { return { kind: "star" }; }
        function bodySel(i) { return { kind: "body", i }; }
        function selEq(a, b) {
            if (!a || !b) return a === b;
            return a.kind === b.kind && (a.i === undefined || a.i === b.i);
        }
        function selObj(s) {
            if (!s) return null;
            if (s.kind === "star") return scene.star;
            return bodies[s.i] || null;
        }
        /* 展示优先级：悬停 > 选中 */
        function activeSel() {
            return selObj(state.hover) ? state.hover : (selObj(state.sel) ? state.sel : null);
        }

        /* ---------- 4. 画布 ---------- */
        const canvas = document.getElementById("c");
        const ctx = canvas.getContext("2d", { alpha: false });
        let W = 0, H = 0, DPR = 1;
        let stars = [];

        function resize() {
            DPR = Math.min(window.devicePixelRatio || 1, 2);
            W = canvas.clientWidth; H = canvas.clientHeight;
            canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
            ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
            makeStars();
        }
        window.addEventListener("resize", resize);

        const STAR_COLORS = ["#ffffff", "#e6eeff", "#ffeedd", "#d6e4ff", "#fff4e6"];
        function makeStars() {
            stars = [];
            const n = Math.round(W * H / 3600);
            for (let i = 0; i < n; i++) {
                const big = Math.random() < 0.055;
                stars.push({
                    x: Math.random(), y: Math.random(),
                    r: big ? 0.9 + Math.random() * 1.1 : 0.28 + Math.random() * 0.55,
                    a: big ? 0.32 + Math.random() * 0.33 : 0.05 + Math.random() * 0.18,
                    ph: Math.random() * TAU, tw: 0.3 + Math.random() * 1.5,
                    c: STAR_COLORS[(Math.random() * STAR_COLORS.length) | 0]
                });
            }
        }

        /* ---------- 5. 投影 ---------- */
        function baseR() { return 0.42 * Math.min(W, H); }

        /* 压缩 / 真实 两种径向比例 */
        function scaleFactor(r) {
            const R = baseR();
            if (state.mode === "linear") return R / 1.6;      /* px per AU */
            const rr = Math.max(r, 1e-6);
            return R * Math.pow(rr / 50, 0.35) / rr;
        }

        const cam = { cosT: 1, sinT: 0, cx: 0, cy: 0 };
        function updateCam() {
            const t = state.tiltDeg * D2R;
            cam.cosT = Math.cos(t); cam.sinT = Math.sin(t);
            cam.cx = W / 2; cam.cy = H / 2;
        }

        /* 世界(AU) -> 屏幕；返回 depth（越大越远） */
        function project(x, y, z) {
            const r = Math.sqrt(x * x + y * y + z * z);
            const s = scaleFactor(r);
            const X = x * s, Y = y * s, Z = z * s;
            const ys = -(Y * cam.cosT + Z * cam.sinT);
            const depth = Y * cam.sinT - Z * cam.cosT;
            return {
                x: cam.cx + state.panX + X * state.zoom,
                y: cam.cy + state.panY + ys * state.zoom,
                depth
            };
        }
        function planetRadiusPx(km) {
            return Math.max(1.3, 2.6 * Math.pow(km / EARTH_R_KM, 0.35) * state.planetSize);
        }

        /* ---------- 6. 颜色工具 ---------- */
        function hex2rgb(h) {
            h = h.replace("#", "");
            if (h.length === 3) h = h.split("").map(c => c + c).join("");
            const v = parseInt(h, 16);
            return [(v >> 16) & 255, (v >> 8) & 255, v & 255];
        }
        function shade(hex, f) {
            const [r, g, b] = hex2rgb(hex);
            const c = v => Math.max(0, Math.min(255, Math.round(v * f)));
            return `rgb(${c(r)},${c(g)},${c(b)})`;
        }

        /* ---------- 7. 球体渲染（含自转表面细节、昼夜界线） ---------- */
        function drawSphere(x, y, R, p, rotAngle, lx, ly, visTilt) {
            ctx.save();
            ctx.beginPath(); ctx.arc(x, y, R, 0, TAU); ctx.clip();

            /* 球体基色（光照中心偏向太阳方向） */
            const g = ctx.createRadialGradient(x + lx * R * 0.35, y + ly * R * 0.35, R * 0.05, x, y, R * 1.12);
            g.addColorStop(0, shade(p.color, 1.30));
            g.addColorStop(0.55, p.color);
            g.addColorStop(1, p.dark);
            ctx.fillStyle = g;
            ctx.fillRect(x - R, y - R, R * 2, R * 2);

            /* 表面细节：绕自转轴旋转，经度方向随自转角移动 */
            if (state.showSpin) {
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(visTilt);

                for (const b of p.bands || []) {
                    const c = Math.cos(b.lat * D2R);
                    if (c <= 0.02) continue;
                    const y1 = -Math.sin((b.lat + b.half) * D2R) * R;
                    const y2 = -Math.sin((b.lat - b.half) * D2R) * R;
                    ctx.globalAlpha = b.alpha;
                    ctx.fillStyle = b.color;
                    ctx.fillRect(-R * c, Math.min(y1, y2), 2 * R * c, Math.abs(y2 - y1) + 0.6);
                }

                for (const f of p.features || []) {
                    const a = f.lon * D2R - rotAngle;
                    const ca = Math.cos(a);
                    if (ca <= 0.02) continue;                     /* 转到背面则不可见 */
                    const px = Math.sin(a) * Math.cos(f.lat * D2R) * R;
                    const py = -Math.sin(f.lat * D2R) * R;
                    const rx = Math.max(0.4, R * f.rx * ca);
                    const ry = Math.max(0.4, R * f.ry);
                    ctx.globalAlpha = Math.min(1, ca * 1.7) * (f.alpha === undefined ? 1 : f.alpha);
                    ctx.fillStyle = f.color;
                    ctx.beginPath(); ctx.ellipse(px, py, rx, ry, 0, 0, TAU); ctx.fill();
                }
                ctx.globalAlpha = 1;
                ctx.restore();

                /* 自转轴提示 */
                if (R > 7 && Math.abs(visTilt) > 0.12) {
                    ctx.save();
                    ctx.translate(x, y); ctx.rotate(visTilt);
                    ctx.strokeStyle = "rgba(170,205,255,.40)";
                    ctx.lineWidth = Math.max(0.7, R * 0.045);
                    ctx.beginPath(); ctx.moveTo(0, -R * 1.28); ctx.lineTo(0, R * 1.28); ctx.stroke();
                    ctx.restore();
                }
            }

            /* 昼夜界线（背光面变暗） */
            const ox = x - lx * R * 0.88, oy = y - ly * R * 0.88;
            const ng = ctx.createRadialGradient(ox, oy, R * 0.12, ox, oy, R * 1.9);
            ng.addColorStop(0, "rgba(0,0,0,.90)");
            ng.addColorStop(0.42, "rgba(0,0,0,.58)");
            ng.addColorStop(0.72, "rgba(0,0,0,.14)");
            ng.addColorStop(1, "rgba(0,0,0,0)");
            ctx.fillStyle = ng;
            ctx.fillRect(x - R, y - R, R * 2, R * 2);

            /* 边缘微光 */
            const rim = ctx.createRadialGradient(x, y, R * 0.86, x, y, R);
            rim.addColorStop(0, "rgba(255,255,255,0)");
            rim.addColorStop(1, hueRim(p.color));
            ctx.fillStyle = rim;
            ctx.fillRect(x - R, y - R, R * 2, R * 2);

            ctx.restore();
        }
        function hueRim(hex) {
            const [r, g, b] = hex2rgb(hex);
            return `rgba(${Math.min(255, r + 40)},${Math.min(255, g + 40)},${Math.min(255, b + 40)},.20)`;
        }

        /* 土星/天王星环：后半环 -> 行星 -> 前半环 */
        function drawRingBand(p, sx, sy, R, visTilt, flatten, half) {
            const bands = [
                { r0: 1.24, r1: 1.53, a: 0.20 },
                { r0: 1.53, r1: 1.95, a: 0.52 },
                { r0: 2.02, r1: 2.27, a: 0.34 }
            ];
            if (p.rings && p.rings.inner > 1.3) {              /* 天王星细环 */
                bands.length = 0;
                bands.push({ r0: p.rings.inner, r1: p.rings.inner + 0.05, a: 0.35 },
                    { r0: p.rings.outer - 0.05, r1: p.rings.outer, a: 0.30 });
            }
            ctx.save();
            ctx.translate(sx, sy);
            ctx.rotate(visTilt);
            ctx.scale(1, flatten);
            const a0 = half === "front" ? 0 : Math.PI;
            const a1 = half === "front" ? Math.PI : TAU;
            for (const b of bands) {
                const mid = (b.r0 + b.r1) / 2 * R * (p.rings && p.rings.inner > 1.3 ? 1 : 1);
                ctx.beginPath();
                ctx.arc(0, 0, mid, a0, a1);
                ctx.strokeStyle = `rgba(232,220,186,${b.a * (half === "front" ? 1 : 0.72)})`;
                ctx.lineWidth = (b.r1 - b.r0) * R * (p.rings && p.rings.inner > 1.3 ? 1 : 1);
                ctx.stroke();
            }
            ctx.restore();
        }

        /* ---------- 8. 小行星带 ---------- */
        const belt = [];
        function makeBelt() {
            belt.length = 0;
            const N = 950;
            for (let i = 0; i < N; i++) {
                const a = 2.06 + Math.pow(Math.random(), 0.8) * 1.26;
                belt.push({
                    a, e: Math.random() * 0.13, inc: Math.random() * 0.17,
                    node: Math.random() * TAU, ph: Math.random() * TAU,
                    per: Math.pow(a, 1.5) * 365.256,
                    s: Math.random() < 0.92 ? 0.7 : 1.15,
                    al: 0.10 + Math.random() * 0.26
                });
            }
        }
        makeBelt();

        /* ---------- 9. 轨道路径缓存 ---------- */
        let orbitCache = { key: "", data: [] };
        function orbitPaths() {
            const key = state.mode + "|" + state.tiltDeg.toFixed(1) + "|" + W + "x" + H + "|" + state.zoom.toFixed(3) +
                "|" + state.panX.toFixed(1) + "," + state.panY.toFixed(1) + "|" + Math.floor(state.simDays / 365);
            if (orbitCache.key === key) return orbitCache.data;
            const T = state.simDays / 36525;
            const data = bodies.map(p => {
                if (!p.el) return [];
                const el = elemAt(p, T);
                const SEG = 260, pts = [];
                for (let i = 0; i <= SEG; i++) {
                    const v = posFromElems(el, i / SEG * TAU);
                    pts.push(project(v.x, v.y, v.z));
                }
                return pts;
            });
            orbitCache = { key, data };
            return data;
        }

        /* ---------- 10. 主渲染 ---------- */
        let screenInfo = [];
        function render(time) {
            updateCam();
            ctx.fillStyle = "#000000";                 /* 纯黑背景 */
            ctx.fillRect(0, 0, W, H);

            /* 星空（固定于天球，不随缩放变化） */
            if (state.showStars) {
                for (let i = 0; i < stars.length; i++) {
                    const s = stars[i];
                    const x = s.x * W + state.panX * 0.10;
                    const y = s.y * H + state.panY * 0.10;
                    if (x < -2 || x > W + 2 || y < -2 || y > H + 2) continue;
                    ctx.globalAlpha = s.a * (0.72 + 0.28 * Math.sin(time * s.tw + s.ph));
                    ctx.fillStyle = s.c;
                    if (s.r < 0.7) ctx.fillRect(x, y, 1, 1);
                    else { ctx.beginPath(); ctx.arc(x, y, s.r, 0, TAU); ctx.fill(); }
                }
                ctx.globalAlpha = 1;
            }

            /* 太阳：半径与标注取自 scene.star，可悬停/点选 */
            const star = scene.star;
            const sunScreenR = Math.max(1.5, planetRadiusPx(star.radiusKm) * state.zoom);
            const sunX = cam.cx + state.panX, sunY = cam.cy + state.panY;
            const sunActive = selEq(state.hover, starSel()) || selEq(state.sel, starSel());

            /* 太阳光晕 */
            const glowR = sunScreenR * 5.2;
            const sg = ctx.createRadialGradient(sunX, sunY, sunScreenR * 0.6, sunX, sunY, glowR);
            sg.addColorStop(0, "rgba(255,247,224,.95)");
            sg.addColorStop(0.07, "rgba(255,232,170,.55)");
            sg.addColorStop(0.20, "rgba(255,186,80,.18)");
            sg.addColorStop(0.48, "rgba(255,150,40,.055)");
            sg.addColorStop(1, "rgba(255,120,0,0)");
            ctx.fillStyle = sg;
            ctx.beginPath(); ctx.arc(sunX, sunY, glowR, 0, TAU); ctx.fill();
            ctx.fillStyle = "#fffdf3";
            ctx.beginPath(); ctx.arc(sunX, sunY, sunScreenR, 0, TAU); ctx.fill();

            /* 小行星带 */
            if (state.showBelt && state.mode === "compressed") {
                const t = state.simDays;
                for (const o of belt) {
                    const M = o.ph + TAU * t / o.per;
                    const E = M + o.e * Math.sin(M);
                    const px = o.a * (Math.cos(E) - o.e);
                    const py = o.a * Math.sqrt(1 - o.e * o.e) * Math.sin(E);
                    const cn = Math.cos(o.node), sn = Math.sin(o.node);
                    let X = px * cn - py * sn, Y = px * sn + py * cn;
                    const ci = Math.cos(o.inc), si = Math.sin(o.inc);
                    const Y2 = Y * ci, Z2 = Y * si;
                    const pr = project(X, Y2, Z2);
                    ctx.globalAlpha = o.al;
                    ctx.fillStyle = "#c9c0ab";
                    const sz = o.s * Math.min(1.6, state.zoom);
                    ctx.fillRect(pr.x, pr.y, sz, sz);
                }
                ctx.globalAlpha = 1;
            }

            /* 轨道线 */
            if (state.showOrbits) {
                const paths = orbitPaths();
                for (let i = 0; i < paths.length; i++) {
                    const p = bodies[i];
                    const pts = paths[i];
                    if (!pts || !pts.length) continue;
                    const active = selEq(state.hover, bodySel(i)) || selEq(state.sel, bodySel(i));
                    ctx.strokeStyle = active ? "rgba(180,215,255,.55)" : "rgba(126,158,214,.20)";
                    ctx.lineWidth = active ? 1.15 : 0.7;
                    if (p.type === "dwarf") ctx.setLineDash([3, 4]);
                    ctx.beginPath();
                    ctx.moveTo(pts[0].x, pts[0].y);
                    for (let k = 1; k < pts.length; k++) ctx.lineTo(pts[k].x, pts[k].y);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }
            }

            /* 天体位置 */
            const list = [];
            screenInfo = bodies.map(() => null);
            for (let i = 0; i < bodies.length; i++) {
                const p = bodies[i];
                if (!p.el) continue;          /* 预留：无轨道的天体（卫星/空间站等）另行渲染 */
                const v = planetPos(p, state.simDays);
                const pr = project(v.x, v.y, v.z);
                const R = planetRadiusPx(p.radiusKm) * state.zoom;
                const dist = Math.sqrt(v.x * v.x + v.y * v.y + v.z * v.z);
                screenInfo[i] = { x: pr.x, y: pr.y, r: R, dist, pos: v };
                list.push({ depth: pr.depth, i, p, pr, R });
            }
            list.sort((a, b) => a.depth - b.depth);

            /* 光照方向（屏幕空间：行星 -> 太阳） */
            for (const it of list) {
                const { p, pr, R, i } = it;
                let lx = sunX - pr.x, ly = sunY - pr.y;
                const ln = Math.hypot(lx, ly) || 1;
                lx /= ln; ly /= ln;

                /* 自转角：由真实自转周期决定（负值表示逆行自转） */
                const rot = TAU * (state.simDays / p.rotPeriod);
                let visTilt = p.tilt * D2R;
                if (p.tilt > 90) visTilt = (180 - p.tilt) * D2R;
                visTilt = Math.max(-1.05, Math.min(1.05, visTilt));

                if (p.rings) {
                    const flatten = Math.max(0.12, Math.min(1, Math.sin(state.tiltDeg * D2R) + 0.02));
                    drawRingBand(p, pr.x, pr.y, R, visTilt, flatten, "back");
                    drawSphere(pr.x, pr.y, R, p, rot, lx, ly, visTilt);
                    drawRingBand(p, pr.x, pr.y, R, visTilt, flatten, "front");
                } else {
                    drawSphere(pr.x, pr.y, R, p, rot, lx, ly, visTilt);
                }

                /* 悬停/选中的高亮圈 */
                const hl = selEq(state.hover, bodySel(i)) || selEq(state.sel, bodySel(i));
                if (hl) {
                    ctx.strokeStyle = "rgba(160,205,255,.75)";
                    ctx.lineWidth = 1;
                    ctx.beginPath(); ctx.arc(pr.x, pr.y, Math.max(R + 5, 9), 0, TAU); ctx.stroke();
                }

                /* 名称标注 */
                if (state.showLabels) {
                    const rightSide = pr.x > cam.cx + W * 0.22;
                    const off = Math.max(R + 8, 12);
                    const tx = rightSide ? pr.x - off : pr.x + off;
                    ctx.font = '11.5px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
                    ctx.textAlign = rightSide ? "right" : "left";
                    ctx.textBaseline = "middle";
                    ctx.fillStyle = "rgba(0,0,0,.75)";
                    ctx.fillText(p.cn, tx + 1, pr.y + 1);
                    ctx.fillStyle = hl ? "#ffffff" : "rgba(203,220,250,.80)";
                    ctx.fillText(p.cn, tx, pr.y);
                }
            }

            /* 太阳标注 */
            ctx.font = '12px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
            ctx.textAlign = "left"; ctx.textBaseline = "middle";
            if (sunActive) {
                ctx.strokeStyle = "rgba(255,225,150,.8)";
                ctx.lineWidth = 1;
                ctx.beginPath(); ctx.arc(sunX, sunY, sunScreenR + 7, 0, TAU); ctx.stroke();
            }
            ctx.fillStyle = sunActive ? "#fff8e1" : "rgba(255,236,180,.85)";
            ctx.fillText(star.cn, sunX + sunScreenR + 9, sunY + sunScreenR * 0.15);
        }

        /* ---------- 11. 时间与日期 ---------- */
        function jdFromSim(d) { return J2000_JD + d; }
        function dateFromJD(jd) {
            let Z = Math.floor(jd + 0.5), F = (jd + 0.5) - Z, A = Z;
            if (Z >= 2299161) {
                const al = Math.floor((Z - 1867216.25) / 36524.25);
                A = Z + 1 + al - Math.floor(al / 4);
            }
            const B = A + 1524, C = Math.floor((B - 122.1) / 365.25);
            const D = Math.floor(365.25 * C), E = Math.floor((B - D) / 30.6001);
            const day = Math.floor(B - D - Math.floor(30.6001 * E) + F);
            const month = E < 14 ? E - 1 : E - 13;
            const year = month > 2 ? C - 4716 : C - 4715;
            return { year, month, day };
        }
        function jdFromDate(y, m, d) {
            const a = Math.floor((14 - m) / 12), yy = y + 4800 - a, mm = m + 12 * a - 3;
            return d + Math.floor((153 * mm + 2) / 5) + 365 * yy + Math.floor(yy / 4) -
                Math.floor(yy / 100) + Math.floor(yy / 400) - 32045 - 0.5;
        }
        function nowSimDays() { return Date.now() / 86400000 + 2440587.5 - J2000_JD; }

        function fmtClock() {
            const jd = jdFromSim(state.simDays);
            const { year, month, day } = dateFromJD(jd);
            const p2 = v => String(v).padStart(2, "0");
            const frac = jd + 0.5 - Math.floor(jd + 0.5);      /* UT 日内小数 */
            const hh = Math.floor(frac * 24), mm = Math.floor((frac * 24 - hh) * 60);
            return `${year}-${p2(month)}-${p2(day)}  ${p2(hh)}:${p2(mm)} UT`;
        }
        function fmtSpeed(v) {
            if (v < 1) return v.toFixed(2) + " 天/秒";
            if (v < 400) return v.toFixed(0) + " 天/秒";
            return (v / 365.25).toFixed(1) + " 年/秒";
        }
        function fmtAU(au) {
            if (au < 0.01) return au.toExponential(2) + " AU";
            return au.toFixed(3) + " AU";
        }

        /* ---------- 12. UI ---------- */
        const el = id => document.getElementById(id);
        const plistEl = el("plist"), infoEl = el("info"), levelsEl = el("levels");

        /* 展示中的档案目标：null 表示星系总览 */
        let infoNow = null;

        /* --- 层级切换（河系 / 星系）：新增 DB.galaxies / DB.systems 条目即自动出现 --- */
        function buildLevels() {
            levelsEl.innerHTML = "";
            DB.galaxies.forEach(g => {
                const b = document.createElement("div");
                b.className = "pbtn";
                b.innerHTML = `<i class="dot" style="background:#9fb6ff"></i>${g.cn}`;
                b.addEventListener("click", () => showGalaxy(g));
                levelsEl.appendChild(b);
            });
            DB.systems.forEach(s => {
                const b = document.createElement("div");
                b.className = "pbtn";
                b.innerHTML = `<i class="dot" style="background:${s.star ? s.star.color : "#fff"}"></i>${s.cn}`;
                b.addEventListener("click", () => loadSystem(s.id));
                levelsEl.appendChild(b);
            });
        }

        /* --- 天体列表（随场景重建） --- */
        let listBtns = [];
        function buildBodyList() {
            plistEl.innerHTML = "";
            listBtns = [];
            const add = (sel, dot, label) => {
                const b = document.createElement("div");
                b.className = "pbtn";
                b.innerHTML = `<i class="dot" style="background:${dot}"></i>${label}`;
                b.addEventListener("click", () => focusTarget(sel));
                plistEl.appendChild(b);
                listBtns.push({ sel, el: b });
            };
            add(null, "rgba(170,195,255,.4)", "全景");
            if (scene.star) add(starSel(), scene.star.color, scene.star.cn);
            bodies.forEach((p, i) => add(bodySel(i), p.color || "#ccc", p.cn));
        }

        function syncUI() {
            listBtns.forEach(t => t.el.classList.toggle("on", t.sel ? selEq(state.sel, t.sel) : !state.sel));
        }

        const TYPE_CN = {
            star: "恒星", planet: "行星", dwarf: "矮行星", moon: "卫星",
            asteroid: "小行星", comet: "彗星", station: "空间站", galaxy: "星系", system: "星系系统"
        };

        /* --- 档案渲染：天体对象里加 detail 分组 / game 数据即自动显示 --- */
        function detailHTML(obj, idx) {
            let h = `<div class="nm">${obj.cn}<small>${obj.en || ""}</small>` +
                (TYPE_CN[obj.type] ? `<small>· ${TYPE_CN[obj.type]}</small>` : "") + `</div>`;
            h += liveRowsHTML(obj, idx);
            for (const g of (obj.detail || [])) {
                h += `<div class="grp">${g.g}</div>`;
                h += g.kv.map(([k, v]) => `<div class="kv"><span>${k}</span><span>${v}</span></div>`).join("");
            }
            if (obj.game && Object.keys(obj.game).length) {
                h += `<div class="grp">游戏数据</div>`;
                h += Object.entries(obj.game).map(([k, v]) =>
                    `<div class="kv"><span>${k}</span><span>${v}</span></div>`).join("");
            }
            if (obj.desc) h += `<div class="desc">${obj.desc}</div>`;
            return h;
        }

        /* 实时区：随模拟时间变化的轨道 / 自转数据（由字段自动生成，无需写进 detail） */
        function liveRowsHTML(obj, idx) {
            if (!obj || !obj.el) return "";
            const si = (idx !== undefined && idx >= 0) ? screenInfo[idx] : null;
            const rows = [];
            if (si) rows.push(["当前距日", `${fmtAU(si.dist)}（${(si.dist * 149597870.7 / 1e6).toFixed(1)} 百万 km）`, "liveDist"]);
            if (obj.periodTxt) rows.push(["公转周期", obj.periodTxt]);
            if (obj.rotPeriod !== undefined) rows.push(["自转周期", Math.abs(obj.rotPeriod).toFixed(3) + " 天" + (obj.rotPeriod < 0 ? "（逆行）" : "")]);
            if (obj.el.a) rows.push(["轨道半长轴", obj.el.a[0].toFixed(3) + " AU"]);
            if (obj.el.e) rows.push(["轨道偏心率", obj.el.e[0].toFixed(4)]);
            if (obj.el.I) rows.push(["轨道倾角", obj.el.I[0].toFixed(2) + "°"]);
            if (obj.tilt !== undefined) rows.push(["自转轴倾角", obj.tilt + "°"]);
            if (obj.moons !== undefined) rows.push(["已知卫星", obj.moons + " 颗"]);
            if (!rows.length) return "";
            return `<div class="grp">轨道与自转（实时）</div>` + rows.map(([k, v, id]) =>
                `<div class="kv"><span>${k}</span><span${id ? ` id="${id}"` : ""}>${v}</span></div>`).join("");
        }

        function showInfo() {
            const s = activeSel();
            const obj = selObj(s);
            infoNow = obj ? { obj, idx: s.kind === "body" ? s.i : -1 } : null;
            if (obj) { infoEl.innerHTML = detailHTML(obj, infoNow.idx); return; }
            /* 未选中：显示当前星系总览 */
            infoEl.innerHTML = detailHTML({
                cn: scene.cn, en: scene.en, type: "system",
                detail: [{
                    g: "本层级", kv: [
                        ["所属星系", DB.galaxies.map(g => g.cn).join("、") || "未定义"],
                        ["中心恒星", scene.star ? scene.star.cn : "—"],
                        ["已加载天体", bodies.length + " 个（含矮行星）"],
                        ["可选星系", DB.systems.map(s2 => s2.cn).join("、")]
                    ]
                }],
                desc: "点击画布中的太阳或任意行星（或右侧列表）查看完整档案：质量、大气、组成成分、光谱特征、探测任务等。"
            });
        }

        function showGalaxy(g) {
            state.sel = null; state.follow = null; state.hover = null;
            infoNow = { obj: g, idx: -1 };
            infoEl.innerHTML = detailHTML(g, -1);
            syncUI();
        }

        /* 切换星系：重指 scene，重建列表与视图（新增星系后无需改渲染代码） */
        function loadSystem(id) {
            const s = DB.systems.find(x => x.id === id);
            if (!s) return;
            DB.activeSystemId = id;
            scene = normalizeBodies(s);
            bodies = scene.bodies;
            state.sel = null; state.follow = null; state.hover = null;
            orbitCache.key = "";
            resetView();
            buildBodyList(); syncUI(); showInfo();
        }

        function focusTarget(sel) {
            state.sel = sel;
            state.follow = sel;
            const obj = selObj(sel);
            if (obj && obj.radiusKm) {
                const R = planetRadiusPx(obj.radiusKm);
                state.zoom = Math.max(1, Math.min(400, Math.min(W, H) * 0.10 / R));
            } else {
                resetView();
            }
            syncUI(); showInfo();
        }
        function resetView() {
            state.zoom = 1; state.panX = 0; state.panY = 0;
        }

        /* 控件绑定 */
        const speedSlider = el("speed"), speedVal = el("speedVal");
        function sliderToSpeed(v) { return 0.02 * Math.pow(30000 / 0.02, v / 1000); }
        function speedToSlider(s) { return 1000 * Math.log(s / 0.02) / Math.log(30000 / 0.02); }

        function bindUI() {
            el("btnPlay").addEventListener("click", () => {
                state.playing = !state.playing;
                el("btnPlay").textContent = state.playing ? "暂停" : "播放";
            });
            el("btnNow").addEventListener("click", () => {
                state.simDays = nowSimDays();
                const { year, month, day } = dateFromJD(jdFromSim(state.simDays));
                el("date").value = `${year}-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
            });
            el("btnReset").addEventListener("click", () => {
                state.follow = null; state.sel = null; resetView(); syncUI(); showInfo();
            });
            speedSlider.addEventListener("input", () => {
                speedSlider._v = parseFloat(speedSlider.value);
                state.speed = sliderToSpeed(speedSlider._v);
                speedVal.textContent = fmtSpeed(state.speed);
            });
            el("date").addEventListener("change", e => {
                const [y, m, d] = e.target.value.split("-").map(Number);
                if (!y) return;
                state.simDays = jdFromDate(y, m, d) - J2000_JD;
            });
            const tilt = el("tilt");
            tilt.addEventListener("input", () => {
                state.tiltDeg = parseFloat(tilt.value);
                el("tiltVal").textContent = state.tiltDeg.toFixed(0) + "°";
            });
            const size = el("size");
            size.addEventListener("input", () => {
                state.planetSize = parseFloat(size.value);
                el("sizeVal").textContent = state.planetSize.toFixed(1) + "×";
            });
            el("mode").addEventListener("change", e => {
                state.mode = e.target.value;
                state.follow = null;
                resetView();
            });
            el("cOrbits").addEventListener("change", e => state.showOrbits = e.target.checked);
            el("cLabels").addEventListener("change", e => state.showLabels = e.target.checked);
            el("cSpin").addEventListener("change", e => state.showSpin = e.target.checked);
            el("cStars").addEventListener("change", e => state.showStars = e.target.checked);
            el("cBelt").addEventListener("change", e => state.showBelt = e.target.checked);
        }

        /* 鼠标交互 */
        let dragging = false, dragMoved = false, lastX = 0, lastY = 0, downX = 0, downY = 0;
        canvas.addEventListener("mousedown", e => {
            dragging = true; dragMoved = false;
            lastX = downX = e.clientX; lastY = downY = e.clientY;
            canvas.classList.add("dragging");
        });
        window.addEventListener("mouseup", e => {
            if (!dragging) return;
            dragging = false;
            canvas.classList.remove("dragging");
            if (!dragMoved) {
                /* 单击：选中并展示档案（不改变视角）；双击才跟随/放大 */
                const hit = hitTest(e.clientX, e.clientY);
                state.sel = hit;
                state.follow = null;
                syncUI(); showInfo();
            }
        });
        window.addEventListener("mousemove", e => {
            if (dragging) {
                const dx = e.clientX - lastX, dy = e.clientY - lastY;
                if (Math.abs(e.clientX - downX) + Math.abs(e.clientY - downY) > 4) dragMoved = true;
                state.panX += dx; state.panY += dy;
                state.follow = null;
                lastX = e.clientX; lastY = e.clientY;
            } else {
                const hit = hitTest(e.clientX, e.clientY);
                if (!selEq(hit, state.hover)) {
                    state.hover = hit;
                    showInfo();
                    canvas.style.cursor = hit ? "pointer" : "grab";
                }
            }
        });
        canvas.addEventListener("dblclick", e => {
            const hit = hitTest(e.clientX, e.clientY);
            if (hit) focusTarget(hit);
        });
        canvas.addEventListener("wheel", e => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const mx = e.clientX - rect.left, my = e.clientY - rect.top;
            const old = state.zoom;
            const next = Math.max(0.35, Math.min(400, old * Math.pow(1.0016, -e.deltaY)));
            if (next === old) return;
            const k = next / old;
            state.panX = mx - cam.cx - (mx - cam.cx - state.panX) * k;
            state.panY = my - cam.cy - (my - cam.cy - state.panY) * k;
            state.zoom = next;
        }, { passive: false });

        /* 命中测试：返回 null | {kind:"star"} | {kind:"body",i}
           新增可选中对象类型时在此追加判断即可 */
        function hitTest(cx, cy) {
            const rect = canvas.getBoundingClientRect();
            const mx = cx - rect.left, my = cy - rect.top;
            let best = null, bestD = 1e9;
            const tryHit = (sel, x, y, r) => {
                const rad = Math.max(r + 7, 11);
                const d = Math.hypot(mx - x, my - y);
                if (d <= rad && d < bestD) { bestD = d; best = sel; }
            };
            if (scene.star) {
                const sr = Math.max(1.5, planetRadiusPx(scene.star.radiusKm) * state.zoom);
                tryHit(starSel(), cam.cx + state.panX, cam.cy + state.panY, sr);
            }
            for (let i = 0; i < bodies.length; i++) {
                const s = screenInfo[i];
                if (!s) continue;
                tryHit(bodySel(i), s.x, s.y, s.r);
            }
            return best;
        }

        window.addEventListener("keydown", e => {
            if (e.code === "Space") { e.preventDefault(); el("btnPlay").click(); }
            if (e.key === "r" || e.key === "R") { state.follow = null; state.sel = null; resetView(); syncUI(); showInfo(); }
        });

        /* ---------- 13. 主循环 ---------- */
        let last = performance.now();
        function frame(now) {
            const dt = Math.min(0.06, (now - last) / 1000);
            last = now;
            if (state.playing) state.simDays += dt * state.speed;

            /* 跟随模式：把目标放在视野中心（恒星恒在原点） */
            if (state.follow) {
                let X = 0, ys = 0;
                if (state.follow.kind === "body") {
                    const p = bodies[state.follow.i];
                    if (p && p.el) {
                        const v = planetPos(p, state.simDays);
                        const r = Math.sqrt(v.x * v.x + v.y * v.y + v.z * v.z);
                        const s = scaleFactor(r);
                        const Y = v.y * s, Z = v.z * s;
                        X = v.x * s;
                        ys = -(Y * cam.cosT + Z * cam.sinT);
                    }
                }
                state.panX = -X * state.zoom;
                state.panY = -ys * state.zoom;
            }

            render(now / 1000);

            const fobj = selObj(state.follow);
            el("clock").textContent = fmtClock();
            el("rate").textContent = (state.playing ? "▶ " : "⏸ ") + fmtSpeed(state.speed) +
                (fobj ? " · 跟随 " + fobj.cn : "");
            /* 档案里的实时距日距离 */
            if (infoNow && infoNow.idx >= 0) {
                const ld = document.getElementById("liveDist");
                const si = screenInfo[infoNow.idx];
                if (ld && si) {
                    ld.textContent = `${fmtAU(si.dist)}（${(si.dist * 149597870.7 / 1e6).toFixed(1)} 百万 km）`;
                }
            }

            requestAnimationFrame(frame);
        }

        /* ---------- 启动 ---------- */
        function init() {
            resize();
            bindUI();
            buildLevels();
            buildBodyList();
            state.simDays = nowSimDays();
            const { year, month, day } = dateFromJD(jdFromSim(state.simDays));
            el("date").value = `${year}-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
            speedSlider.value = speedToSlider(state.speed);
            speedSlider._v = parseFloat(speedSlider.value);
            speedVal.textContent = fmtSpeed(state.speed);
            el("tiltVal").textContent = state.tiltDeg.toFixed(0) + "°";
            el("sizeVal").textContent = state.planetSize.toFixed(1) + "×";
            showInfo(); syncUI();
            requestAnimationFrame(frame);
        }
        init();
        /* 调试/扩展入口：控制台可直接操作 DB / scene / loadSystem / focusTarget */
        window.SolarSystem = { DB, state, loadSystem, focusTarget, get scene() { return scene; }, get bodies() { return bodies; } };
    </script>
</body>

</html>
